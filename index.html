<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--b1:#2b8d92;--b2:#165a63;--b3:#0b3038;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#1d6b70;--b2:#0b2f36;--b3:#04121a}}
:root[data-theme="dark"]{--b1:#1d6b70;--b2:#0b2f36;--b3:#04121a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(ellipse at 28% 18%,var(--b1),var(--b2) 48%,var(--b3));background-attachment:fixed;color:#e7c35e;font-family:"Cormorant Garamond",Georgia,serif}
.scroll{height:340svh}
.stage{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;place-items:center}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.glow{position:absolute;left:50%;width:min(130vw,900px);aspect-ratio:2;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,206,110,.3),transparent);opacity:0;pointer-events:none}
.card{--ink:#3a2a1c;position:relative;container-type:inline-size;width:min(92vw,49svh,760px);aspect-ratio:50/94}
.paper{position:absolute;inset:0;opacity:0;background:repeating-linear-gradient(0deg,rgba(150,120,60,.05) 0 1px,transparent 1px 3px),radial-gradient(circle at 50% 40%,#fffaf0,#f6e8c8 85%);box-shadow:0 0 0 1.6cqw #d7b45c,0 0 0 2.4cqw #8e6a1f,0 3cqw 9cqw rgba(0,0,0,.55)}
.band{position:absolute;opacity:0;inset:10.5cqw;border:3.3cqw solid #8fd5e0;box-shadow:0 0 0 .4cqw #c9a24a}
.inner{position:absolute;opacity:0;inset:14cqw;border:1.1cqw solid #343c42;outline:.3cqw solid #c8cfd3;outline-offset:-1.7cqw}
#orn,.og,.vn{position:absolute;inset:0;width:100%;height:100%}
.og{opacity:0}.vn{opacity:0;overflow:visible}
.vn path{fill:none;stroke:#c9a24a;stroke-width:.45}
.o{position:absolute}.o svg{width:100%;height:100%;display:block;overflow:visible}
.content{position:absolute;inset:21cqw 20cqw;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;color:var(--ink)}
.g{opacity:0}
.w{display:inline-block;white-space:nowrap}
.bism{display:flex;gap:.28em;direction:rtl;width:max-content;font:700 8.5cqw/1.5 "Aref Ruqaa","Amiri",serif;will-change:transform}
.gold{background:linear-gradient(100deg,#b88a2a 0%,#f0cf72 30%,#fff6c8 48%,#e0b04a 65%,#b88a2a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.ayah{font:400 4.1cqw/1.85 "Amiri",serif}
.tr{font:italic 500 3.2cqw/1.35 "Cormorant Garamond",serif}
.ref{font:600 2.4cqw "Cormorant Garamond",serif;letter-spacing:.12em;text-transform:uppercase}
.cap{font:600 2.1cqw/1.7 "Cormorant Garamond",serif;letter-spacing:.1em;text-transform:uppercase}

.nm{font:9.5cqw/1.15 "Great Vibes",cursive}
.sig{width:112%;display:grid;grid-template-columns:1fr 1fr;gap:7cqw;align-items:end}
.sg{display:flex;flex-direction:column;align-items:stretch;text-align:center}
.sn{display:block;white-space:nowrap;transform:rotate(-3deg);margin-bottom:-.5cqw;clip-path:inset(-25% 100% -25% -10%)}
#s1{font:400 6cqw/1.5 "Mrs Saint Delafield","Great Vibes",cursive;color:#4a1631}
#s2{font:400 8.5cqw/1.15 "Herr Von Muellerhoff","Great Vibes",cursive;color:#10204f;transform:rotate(-4deg)}
#s2::after{content:"";display:block;height:.45cqw;margin:-.2cqw 4% 0 12%;background:linear-gradient(90deg,transparent,currentColor 18%,currentColor 82%,transparent);transform:rotate(-1.5deg)}
.sig i{font:600 1.9cqw "Cormorant Garamond",serif;font-style:normal;letter-spacing:.14em;border-top:.25cqw solid var(--ink);padding-top:.8cqw}
.sc{position:absolute;left:20cqw;right:20cqw;height:69cqw;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;text-align:center;color:var(--ink)}
.sc .big{font:700 17cqw/1 "Cormorant Garamond",serif;color:var(--c)}
.sc .dy{font:italic 500 3.8cqw/1.3 "Cormorant Garamond",serif}
.pn{position:absolute;left:19.5cqw;right:19.5cqw;top:23cqw;height:70.6cqw;background:linear-gradient(#e3ecc9,#f4f7e4);border:.3cqw solid #c9a24a;border-radius:2cqw 2cqw 0 0;transform:scaleY(0);transform-origin:50% 100%;opacity:0}
.pn2{top:94.4cqw;background:linear-gradient(#fdf0b8,#f9d96e);border-radius:0 0 2cqw 2cqw;transform-origin:50% 0}
.dv{position:absolute;left:19.5cqw;right:19.5cqw;top:93.8cqw;height:.5cqw;background:linear-gradient(90deg,transparent,#c9a24a 15%,#c9a24a 85%,transparent);transform:scaleX(0)}
.dv::after{content:"";position:absolute;left:50%;top:50%;width:3.2cqw;height:3.2cqw;margin:-1.6cqw;transform:rotate(45deg);background:#c9a24a;border:.5cqw solid #fff3bf}
.tag{position:absolute;left:0;right:0;text-align:center;padding:0 8vw;font:italic 500 clamp(19px,5vw,32px)/1.4 "Cormorant Garamond",Georgia,serif;letter-spacing:.06em;background:linear-gradient(100deg,#d9a93f,#fff0b0 50%,#d9a93f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.hint{position:absolute;bottom:calc(4svh + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font:600 11px "Cormorant Garamond",serif;letter-spacing:.4em;text-transform:uppercase;color:#e7c35e}
.hint::after{content:"";display:block;width:1px;height:34px;margin:10px auto 0;background:linear-gradient(#e7c35e,transparent);animation:dr 1.8s ease-in-out infinite}
@keyframes dr{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@media (prefers-reduced-motion:reduce){.hint::after{animation:none}.scroll{height:100svh}}
</style>

<script>
/* Edit the card text here */
const D={
 bism:"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ",
 ayah:"وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً ۚ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِّقَوْمٍ يَتَفَكَّرُونَ",
 tr:"And among His signs is this, that He created for you mates from among yourselves, that you may dwell in tranquility with them, and He has put love and mercy between your hearts. Verily in that are signs for those who reflect.",
 ref:"Surah Ar-Rum · 30:21",
 cap:"With the blessings of Allah, we joyfully invite you to the Nikkah of",
 n1:"Tauheed Ahmed",n2:"Sahiba Parveen",
 date:"Date: The 18th of December 2026 (Friday), at VIP Lawn, in the city of Varanasi",
 s1:"Sahiba Parveen",s2:"Tauheed Ahmed"
};
/* Mehndi & Haldi page: edit here */
const SEC=[{k:"Mehndi",d:"16",dy:"Wednesday",b:"Henna, music & dance with family and friends",c:"#2f6b3a"},{k:"Haldi",d:"17",dy:"Thursday",b:"A joyful ritual of turmeric, laughter & blessings",c:"#b9650a"}];

const $=id=>document.getElementById(id),R=()=>Math.random()*2-1,cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),E=t=>1-Math.pow(1-t,3);
function T(el,txt,chars,cls,out){
 txt.split(" ").forEach((w,i,a)=>{
  const wd=document.createElement("span");
  if(chars){wd.className="w";[...w].forEach(ch=>{const c=document.createElement("span");c.textContent=ch;wd.append(c);out&&out.push(c)})}
  else{wd.className="w "+(cls||"");wd.textContent=w;out&&out.push(wd)}
  el.append(wd);if(i<a.length-1)el.append(" ");
 });
}
const bw=D.bism.split(" ").map(w=>{const s=document.createElement("span");s.className="w gold";s.textContent=w;return s});
$("bism").append(...bw);
$("s1").textContent=D.s1;$("s2").textContent=D.s2;

/* text groups: letters become target points for the stars */
const GP=[],ST=[];
[["ayah",D.ayah,0],["tr",D.tr,1],["ref",D.ref,1],["cap",D.cap,1],["n1",D.n1,0],["wi","— with —",1],["n2",D.n2,0],["date",D.date,1]].forEach(([id,t,ch],gi)=>{
 const el=$(id),a=[];T(el,t,ch,"",a);el.classList.add("g");GP.push({el,s:.56+gi*.0178});a.forEach(e=>ST.push({el:e,g:gi}));
});
const sg=document.querySelector(".sig");sg.classList.add("g");GP.push({el:sg,s:.56+8*.0178});
sg.querySelectorAll("i").forEach(e=>ST.push({el:e,g:8}));
ST.forEach(s=>{s.s=.1+s.g*.022+Math.random()*.12;s.sw=R()});

/* ornaments, grouped into 8 buckets so the browser animates 8 things, not 250 */
const mkB=()=>Array.from({length:8},()=>{const d=document.createElement("div");d.className="og";$("orn").append(d);return d});
const OBK=mkB(),NBK=mkB(),SEEDS=[],bi=(x,y)=>Math.floor((Math.atan2(y-94,x-50)+Math.PI)/(2*Math.PI)*8)%8;
function put(x,y,sz,sym,rot,col,set,fall){
 const d=document.createElement("div");d.className="o";
 d.style.cssText=`left:${x}cqw;top:${y}cqw;width:${sz}cqw;height:${sz}cqw;margin:${-sz/2}cqw 0 0 ${-sz/2}cqw`;
 d.innerHTML=`<svg viewBox="0 0 100 100" style="color:${col};transform:rotate(${rot}deg)"><use href="#${sym}"/></svg>`;
 set[bi(x,y)].append(d);fall&&SEEDS.push([x,y,bi(x,y)]);
}
function ring(x0,y0,x1,y1,d,ph=0){
 const w=x1-x0,h=y1-y0,nx=Math.round(w/d),ny=Math.round(h/d),p=[];
 for(let i=0;i<nx;i++)p.push([x0+w*(i+ph)/nx,y0,"top"]);
 for(let i=0;i<ny;i++)p.push([x1,y0+h*(i+ph)/ny,"right"]);
 for(let i=0;i<nx;i++)p.push([x1-w*(i+ph)/nx,y1,"bottom"]);
 for(let i=0;i<ny;i++)p.push([x0,y1-h*(i+ph)/ny,"left"]);
 return p;
}
function vine(x0,y0,x1,y1,amp,hw){
 let d="";
 [[x0,y0,x1,y0],[x1,y0,x1,y1],[x1,y1,x0,y1],[x0,y1,x0,y0]].forEach(([ax,ay,bx,by],j)=>{
  const len=Math.hypot(bx-ax,by-ay),k=Math.round(len/hw),n=Math.round(len*1.2),nx=-(by-ay)/len,ny=(bx-ax)/len;
  for(let i=j?1:0;i<=n;i++){const u=i/n,o=amp*Math.sin(Math.PI*k*u);d+=(d?"L":"M")+(ax+(bx-ax)*u+nx*o).toFixed(1)+" "+(ay+(by-ay)*u+ny*o).toFixed(1)}
 });
 return d+"Z";
}
$("orn").insertAdjacentHTML("afterbegin",`<svg class="vn" id="vn" viewBox="0 0 100 188">${[[5.3,5.3,94.7,182.7,2,8],[5.3,5.3,94.7,182.7,-2,8],[17,17,83,171,.9,6]].map(a=>`<path d="${vine(...a)}"/>`).join("")}</svg>`);
const SD={top:180,right:-90,bottom:0,left:90},DIR={top:[1,0,90],right:[0,1,180],bottom:[-1,0,270],left:[0,-1,0]};
ring(5.3,5.3,94.7,182.7,20).forEach(([x,y,sd])=>{
 if((x<6||x>94)&&(y<6||y>182))put(x<50?6.8:93.2,y<94?6.8:181.2,13,"rose",0,"",OBK,1);
 else put(x,y,10,"pal2",SD[sd],"",OBK,1)});
ring(5.3,5.3,94.7,182.7,20,.5).forEach(([x,y,sd])=>{const[dx,dy,a]=DIR[sd];
 put(x,y,5,"rf",Math.random()*60,"",OBK,1);
 put(x+dx*4,y+dy*4,5.6,"rl",a,"",OBK);put(x-dx*4,y-dy*4,5.6,"rl",a+180,"",OBK)});
ring(17,17,83,171,4.4).forEach(([x,y,sd],i)=>{
 if(i%2)put(x,y,4.2,"lf",(sd=="top"||sd=="bottom"?0:90)+(i%4==1?35:-35),"",OBK);
 else put(x,y,3.3,"fl",Math.random()*72,i%6?"#ec6a94":"#d62f45",OBK,1)});

/* page 3: marigold garland, jasmine wreath, Mehndi & Haldi sections */
ring(5.3,5.3,94.7,182.7,6.4).forEach(([x,y],i)=>put(x,y,7.4,"mg",R()*45,i%2?"#f7c331":"#f28c1a",NBK));
ring(17,17,83,171,5.5).forEach(([x,y,sd],i)=>{
 if(i%2)put(x,y,4.4,"lf",(sd=="top"||sd=="bottom"?0:90)+(i%4==1?35:-35),"",NBK);
 else put(x,y,3.6,"js",R()*72,"",NBK)});
["pn pn1","pn pn2","dv"].forEach(c=>{const e=document.createElement("div");e.className=c;e.id=c.split(" ").pop();$("card").append(e)});
const G3=[];
SEC.forEach((s,i)=>{
 const e=document.createElement("div");e.className="sc";e.style.cssText=`top:${i?95.3:24}cqw;--c:${s.c}`;
 e.innerHTML="<p class=cap></p><div class=nm></div><p class=cap></p><p class=big></p><p class=cap></p><p class=dy></p><p class=tr></p>";
 const k=[...e.children];
 T(k[0],"You are invited to",1);T(k[1],s.k,0);T(k[2],"Ceremony",1);T(k[3],s.d,1);T(k[4],"December 2026",1);T(k[5],s.dy,1);T(k[6],s.b,1);
 k.forEach((el,j)=>{el.classList.add("g");G3.push({el,s:.38+(i*7+j)/14*.3,nx:R(),ny:R()})});
 $("card").append(e);
});

/* canvas: stars (page 1 → 2) and falling flowers (page 2 → 3) */
const cv=$("fx"),cx=cv.getContext("2d");
const SP=document.createElement("canvas");SP.width=SP.height=64;
{const c=SP.getContext("2d"),g=c.createRadialGradient(32,32,0,32,32,32);
 g.addColorStop(0,"rgba(255,248,220,1)");g.addColorStop(.18,"rgba(255,214,120,.85)");g.addColorStop(.5,"rgba(255,180,70,.18)");g.addColorStop(1,"rgba(255,170,60,0)");
 c.fillStyle=g;c.fillRect(0,0,64,64);c.fillStyle="rgba(255,244,205,.8)";c.beginPath();c.moveTo(32,2);c.quadraticCurveTo(34,30,62,32);c.quadraticCurveTo(34,34,32,62);c.quadraticCurveTo(30,34,2,32);c.quadraticCurveTo(30,30,32,2);c.fill()}
function mk(pc,cc,n,r){const c=document.createElement("canvas");c.width=c.height=64;const x=c.getContext("2d");x.translate(32,32);
 for(let i=0;i<n;i++){x.rotate(6.2832/n);x.beginPath();x.arc(0,-17,r,0,6.2832);x.fillStyle=pc;x.fill();x.strokeStyle="rgba(120,50,10,.45)";x.lineWidth=1.5;x.stroke()}
 x.beginPath();x.arc(0,0,9,0,6.2832);x.fillStyle=cc;x.fill();return c}
const FS=[mk("#f28c1a","#c56a0c",8,10),mk("#f7c331","#d9780f",8,10),mk("#ee6c98","#f4d06f",5,12),mk("#d62f45","#f0c25a",6,11)];
const PT=SEEDS.map(([x,y,b])=>({cx:x,cy:y,rel:.02+b*.0375+Math.random()*.04,vy:40+Math.random()*50,ph:Math.random()*6.28,r0:Math.random()*6.28,vr:R()*2.5,sz:18+Math.random()*14,f:Math.floor(Math.random()*4),t0:null,x0:0,y0:0}));
const RN=Array.from({length:36},()=>({xr:Math.random(),off:Math.random()*2000,vy:50+Math.random()*50,sp:1+Math.random()*1.5,ph:Math.random()*6.28,vr:R()*2,sz:14+Math.random()*14,f:Math.floor(Math.random()*4)}));

let W=innerWidth,H=innerHeight,dpr=1,P=0,Q=0,lp=-1,lqq=-1,cur=0,tg=0,raf=0;const hero={dx:0,dy:0,K:1};
function spr(f,x,y,s,r){const c=Math.cos(r)*dpr,n=Math.sin(r)*dpr;cx.setTransform(c,n,-n,c,x*dpr,y*dpr);cx.drawImage(FS[f],-s/2,-s/2,s,s)}
function draw(now){
 cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
 if(P>0&&P<.9){
  cx.globalCompositeOperation="lighter";
  for(let i=0;i<ST.length;i++){
   const s=ST[i],t=cl((P-s.s)/.26);if(t<=0)continue;
   const al=Math.min(1,t*5)*(1-cl((P-GP[s.g].s)/.1));if(al<.01)continue;
   const dx=s.tx-s.sx,dy=s.ty-s.sy,sz=(t<1?26-9*E(t):17)*(1+.3*Math.sin(P*70+i*2));
   for(let j=0;j<(t<.97?3:1);j++){
    const k=E(cl(t-j*.035)),w=Math.sin(Math.PI*k)*s.sw*.15,z=sz*(1-j*.2);
    cx.globalAlpha=al*(1-j*.38);
    cx.drawImage(SP,s.sx+dx*k-dy*w-z/2,s.sy+dy*k+dx*w-z/2,z,z)}}
  cx.globalAlpha=1;cx.globalCompositeOperation="source-over";
 }
 if(Q>.01){
  PT.forEach(p=>{if(Q<=p.rel){p.t0=null;return}if(p.t0==null)p.t0=now;
   const tt=(now-p.t0)/1000,y=p.y0+p.vy*tt+60*tt*tt;if(y>H+40)return;
   spr(p.f,p.x0+Math.sin(tt*2.2+p.ph)*22,y,p.sz,p.r0+p.vr*tt)});
  cx.globalAlpha=cl((Q-.35)*4);
  if(cx.globalAlpha>0){const u=now/1000;RN.forEach(r=>spr(r.f,r.xr*W+Math.sin(u*r.sp+r.ph)*26,((u*r.vy+r.off)%(H+80))-40,r.sz,u*r.vr))}
  cx.globalAlpha=1;cx.setTransform(dpr,0,0,dpr,0,0);
 }
}

function render(p,q){
 if(p===lp&&q===lqq)return;lp=p;lqq=q;P=p;Q=q;
 [["paper",.34,.7,.9,1.2],["band",.46,.78,1.15,3],["inner",.5,.82,1.1,3]].forEach(([id,s,e,k,o])=>{
  const t=cl((p-s)/(e-s)),el=$(id);el.style.transform=t>=1?"none":`scale(${k+(1-k)*E(t)})`;el.style.opacity=cl(t*o)});
 $("vn").style.opacity=cl((p-.45)/.25);
 const uL=E(cl(q/.4)),uB=E(cl((q-.2)/.5)),pu=E(cl((q-.3)/.4));
 OBK.forEach((b,k)=>b.style.opacity=Math.min(E(cl((p-.38-k*.0325)/.2)),1-cl((q-.02-k*.0375)/.15)));
 NBK.forEach((b,k)=>b.style.opacity=E(cl((q-.4-k*.03)/.2)));
 GP.forEach(g=>{g.el.style.opacity=cl((p-g.s)/.1)*(1-uL);g.el.style.transform=uL?`translateY(${-10*uL}px)`:""});
 const tb=E(cl((p-.16)/.42)),w=1-tb,b=$("bism");
 b.style.transform=`translate(${hero.dx*w}px,${hero.dy*w}px) scale(${1+(hero.K-1)*w})`;b.style.opacity=1-uL;
 bw.forEach((x,i)=>{const m=Math.sin(Math.PI*tb)*(i%2?-1:1);x.style.transform=`translate(0,${m*28}px) rotate(${m*10}deg)`});
 ["s1","s2"].forEach((id,i)=>{const t=E(cl((p-.84-i*.04)/.12)),e=$(id);e.style.clipPath=`inset(-25% ${100-110*t}% -25% -10%)`;e.style.opacity=1-uL});
 $("tag").style.opacity=$("hint").style.opacity=1-cl(p/.08);$("glow").style.opacity=.9*w*(1-uL);
 G3.forEach(g=>{const t=cl((q-g.s)/.2),k=1-E(t);g.el.style.opacity=t;g.el.style.transform=t>=1?"":`translate(${g.nx*12*k}px,${g.ny*12*k}px)`});
 const m=(a,c)=>`rgb(${a.map((v,i)=>Math.round(v+(c[i]-v)*uB))})`;
 $("band").style.borderColor=m([143,213,224],[245,185,66]);$("inner").style.borderColor=m([52,60,66],[31,93,74]);
 $("dv").style.transform=`scaleX(${E(cl((q-.12)/.28))})`;
 ["pn1","pn2"].forEach(id=>{$(id).style.transform=`scaleY(${pu})`;$(id).style.opacity=cl(pu*2)});
}
const FA=.625;
function rf(f){render(cl(f/FA),cl((f-FA)/(1-FA)))}
function measure(){
 W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
 cv.width=W*dpr;cv.height=H*dpr;
 const st=$("stage").getBoundingClientRect(),cr=$("card").getBoundingClientRect(),b=$("bism");
 b.style.transform="none";const r=b.getBoundingClientRect();
 hero.K=Math.min(W*.88,820)/r.width;hero.dx=W/2-(r.left+r.width/2);hero.dy=H*.46-(r.top+r.height/2);
 $("tag").style.top=(H*.46+r.height*hero.K/2+26)+"px";$("glow").style.top=H*.46+"px";
 ST.forEach(s=>{const q=s.el.getBoundingClientRect(),a=Math.random()*6.283,d=Math.hypot(W,H)*(.55+Math.random()*.3);
  s.tx=q.left+q.width/2-st.left;s.ty=q.top+q.height/2-st.top;s.sx=W/2+Math.cos(a)*d;s.sy=H/2+Math.sin(a)*d});
 PT.forEach(p=>{p.x0=cr.left-st.left+p.cx/100*cr.width;p.y0=cr.top-st.top+p.cy/100*cr.width});
 lp=-1;
}
function upd(){const m=document.documentElement.scrollHeight-innerHeight;tg=m>0?cl(scrollY/m):0}
function frame(now){raf=0;cur+=(tg-cur)*.14;if(Math.abs(tg-cur)<5e-4)cur=tg;rf(cur);draw(now);if(cur!==tg||Q>.01)raf=requestAnimationFrame(frame)}
function kick(){upd();if(!raf)raf=requestAnimationFrame(frame)}
measure();
if(matchMedia("(prefers-reduced-motion: reduce)").matches){render(1,0);draw(0)}
else{upd();cur=tg;rf(cur);draw(0);addEventListener("scroll",kick,{passive:true});if(Q>.01)kick()}
addEventListener("resize",()=>{measure();upd();rf(cur);draw(performance.now())});
document.fonts&&document.fonts.ready.then(()=>{measure();rf(cur);draw(performance.now())});
</script>
</body>
</html>
