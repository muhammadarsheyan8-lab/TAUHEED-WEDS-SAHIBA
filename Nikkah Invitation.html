<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nikkah Invitation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Great+Vibes&family=Mrs+Saint+Delafield&family=Herr+Von+Muellerhoff&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--b1:#2b8d92;--b2:#165a63;--b3:#0b3038;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#1d6b70;--b2:#0b2f36;--b3:#04121a}}
:root[data-theme="dark"]{--b1:#1d6b70;--b2:#0b2f36;--b3:#04121a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(ellipse at 28% 18%,var(--b1),var(--b2) 48%,var(--b3));background-attachment:fixed;color:#e7c35e;font-family:"Cormorant Garamond",Georgia,serif}
.scroll{height:250svh}
.stage{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;place-items:center}
.card{--ink:#f4ce6e;position:relative;container-type:inline-size;width:min(92vw,49svh,760px);aspect-ratio:50/94}
.paper{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(150,120,60,.05) 0 1px,transparent 1px 3px),radial-gradient(circle at 50% 40%,#fffaf0,#f6e8c8 85%);box-shadow:0 0 0 1.6cqw #d7b45c,0 0 0 2.4cqw #8e6a1f,0 3cqw 9cqw rgba(0,0,0,.55)}
.band{position:absolute;inset:10.5cqw;border:3.3cqw solid #8fd5e0;box-shadow:0 0 0 .4cqw #c9a24a}
.inner{position:absolute;inset:14cqw;border:1.1cqw solid #343c42;outline:.3cqw solid #c8cfd3;outline-offset:-1.7cqw}
.vn{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.vn path{fill:none;stroke:#c9a24a;stroke-width:.45;stroke-dasharray:1;stroke-dashoffset:1}
#orn{position:absolute;inset:0}
.o{position:absolute}.o svg{width:100%;height:100%;display:block;overflow:visible}
.content{position:absolute;inset:21cqw 20cqw;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;color:var(--ink)}
.w{display:inline-block;white-space:nowrap}.c{display:inline-block}
.bism{display:flex;gap:.28em;direction:rtl;width:max-content;font:700 8.5cqw/1.5 "Aref Ruqaa","Amiri",serif}
.gold{background:linear-gradient(100deg,#b88a2a 0%,#f0cf72 30%,#fff6c8 48%,#e0b04a 65%,#b88a2a 100%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:sh 7s linear infinite}
@keyframes sh{to{background-position:-250% 0}}
.ayah{font:400 4.1cqw/1.85 "Amiri",serif}
.tr{font:italic 500 3.2cqw/1.35 "Cormorant Garamond",serif}
.ref{font:600 2.4cqw "Cormorant Garamond",serif;letter-spacing:.12em;text-transform:uppercase}
.cap{font:600 2.1cqw/1.7 "Cormorant Garamond",serif;letter-spacing:.1em;text-transform:uppercase}
#date{font-weight:700;font-size:2.4cqw;line-height:1.6}
.nm{font:9.5cqw/1.15 "Great Vibes",cursive}
.ar{display:flex;flex-direction:column;font:700 6cqw/1.2 "Aref Ruqaa","Amiri",serif}
.sig{width:112%;display:grid;grid-template-columns:1fr 1fr;gap:7cqw;align-items:end}
.sg{display:flex;flex-direction:column;align-items:stretch;text-align:center}
.sn{display:block;white-space:nowrap;transform:rotate(-3deg);margin-bottom:-.5cqw;clip-path:inset(-25% 100% -25% -10%)}
#s1{font:400 6cqw/1.5 "Mrs Saint Delafield","Great Vibes",cursive;color:#4a1631}
#s2{font:400 8.5cqw/1.15 "Herr Von Muellerhoff","Great Vibes",cursive;color:#10204f;transform:rotate(-4deg)}
#s2::after{content:"";display:block;height:.45cqw;margin:-.2cqw 4% 0 12%;background:linear-gradient(90deg,transparent,currentColor 18%,currentColor 82%,transparent);transform:rotate(-1.5deg)}
.sig i{font:600 1.9cqw "Cormorant Garamond",serif;font-style:normal;letter-spacing:.14em;border-top:.25cqw solid var(--ink);padding-top:.8cqw}
.tag{position:absolute;left:0;right:0;text-align:center;padding:0 8vw;font:italic 500 clamp(19px,5vw,32px)/1.4 "Cormorant Garamond",Georgia,serif;letter-spacing:.06em;background:linear-gradient(100deg,#b88a2a 0%,#f0cf72 30%,#fff6c8 48%,#e0b04a 65%,#b88a2a 100%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:sh 7s linear infinite;filter:drop-shadow(0 0 10px rgba(255,200,90,.4))}
.hint{position:absolute;bottom:calc(4svh + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font:600 11px "Cormorant Garamond",serif;letter-spacing:.4em;text-transform:uppercase;color:#e7c35e}
.hint::after{content:"";display:block;width:1px;height:34px;margin:10px auto 0;background:linear-gradient(#e7c35e,transparent);animation:dr 1.8s ease-in-out infinite}
@keyframes dr{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@media (prefers-reduced-motion:reduce){.gold,.hint::after{animation:none}.scroll{height:100svh}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="pal" viewBox="0 0 100 100"><path d="M50 70C14 74 4 44 12 26C30 30 46 46 50 70Z" fill="#7fcfae" stroke="#c9a24a" stroke-width="2"/><path d="M50 70C86 74 96 44 88 26C70 30 54 46 50 70Z" fill="#7fcfae" stroke="#c9a24a" stroke-width="2"/><path d="M50 6C74 28 80 58 50 94C20 58 26 28 50 6Z" fill="#23698f" stroke="#c9a24a" stroke-width="2.5"/><path d="M50 26C61 40 63 58 50 76C37 58 39 40 50 26Z" fill="#ec6a94"/><circle cx="50" cy="86" r="5" fill="#e6bf5a"/></symbol>
<symbol id="fl" viewBox="0 0 100 100"><g fill="currentColor" stroke="#a82c52" stroke-width="3"><ellipse cx="50" cy="26" rx="16" ry="22"/><ellipse cx="50" cy="26" rx="16" ry="22" transform="rotate(72 50 50)"/><ellipse cx="50" cy="26" rx="16" ry="22" transform="rotate(144 50 50)"/><ellipse cx="50" cy="26" rx="16" ry="22" transform="rotate(216 50 50)"/><ellipse cx="50" cy="26" rx="16" ry="22" transform="rotate(288 50 50)"/></g><circle cx="50" cy="50" r="11" fill="#f4d06f"/></symbol>
<symbol id='pal2' viewBox='0 0 100 100'><path d='M50 74C16 80 2 52 8 28C26 32 44 48 50 74ZM50 74C84 80 98 52 92 28C74 32 56 48 50 74Z' fill='#8fd3b0' stroke='#c9a24a' stroke-width='2.2'/><path d='M50 4C76 26 84 58 50 96C16 58 24 26 50 4Z' fill='#235f8c' stroke='#c9a24a' stroke-width='2.8'/><path d='M50 22C62 38 64 58 50 82C36 58 38 38 50 22Z' fill='#ee6c98' stroke='#c9a24a' stroke-width='1.8'/><path d='M50 40C55 49 55 58 50 66C45 58 45 49 50 40Z' fill='#b8305f'/><path d='M30 70C20 62 24 46 32 40M70 70C80 62 76 46 68 40' fill='none' stroke='#e8c36a' stroke-width='2'/><circle cx='50' cy='12' r='3' fill='#e8c36a'/></symbol>
<symbol id='rl' viewBox='0 0 100 100'><path d='M30 94C14 62 28 22 64 6C70 30 62 44 56 56C70 52 74 40 74 40C74 66 56 92 30 94Z' fill='#8fd3b0' stroke='#c9a24a' stroke-width='3'/><path d='M34 86C42 62 54 36 62 14' fill='none' stroke='#c9a24a' stroke-width='2'/></symbol>
<symbol id='rf' viewBox='0 0 100 100'><g fill='#d62f45' stroke='#8f1630' stroke-width='3'><circle cx='50' cy='22' r='19'/><circle cx='50' cy='22' r='19' transform='rotate(60 50 50)'/><circle cx='50' cy='22' r='19' transform='rotate(120 50 50)'/><circle cx='50' cy='22' r='19' transform='rotate(180 50 50)'/><circle cx='50' cy='22' r='19' transform='rotate(240 50 50)'/><circle cx='50' cy='22' r='19' transform='rotate(300 50 50)'/></g><circle cx='50' cy='50' r='15' fill='#f0c25a' stroke='#b8862a' stroke-width='2.5'/><circle cx='50' cy='50' r='6' fill='#d62f45'/></symbol>
<symbol id='rose' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='#8fd3b0' stroke='#c9a24a' stroke-width='3'/><g fill='#235f8c' stroke='#c9a24a' stroke-width='2.5'><path id='rp' d='M50 6C62 20 62 34 50 44C38 34 38 20 50 6Z'/><use href='#rp' transform='rotate(45 50 50)'/><use href='#rp' transform='rotate(90 50 50)'/><use href='#rp' transform='rotate(135 50 50)'/><use href='#rp' transform='rotate(180 50 50)'/><use href='#rp' transform='rotate(225 50 50)'/><use href='#rp' transform='rotate(270 50 50)'/><use href='#rp' transform='rotate(315 50 50)'/></g><circle cx='50' cy='50' r='20' fill='#ee6c98' stroke='#c9a24a' stroke-width='3'/><circle cx='50' cy='50' r='9' fill='#f0c25a'/></symbol>
<symbol id="lf" viewBox="0 0 100 100"><path d="M8 50C30 14 70 14 92 50C70 86 30 86 8 50Z" fill="#7fcfae" stroke="#4aa07c" stroke-width="5"/></symbol>
</defs></svg>

<main class="scroll"><section class="stage" id="stage">
  <div class="card" id="card">
    <div class="paper" id="paper"></div>
    <div class="band" id="band"></div>
    <div class="inner" id="inner"></div>
    <div id="orn"></div>
    <div class="content">
      <div class="bism" id="bism" dir="rtl" lang="ar"></div>
      <p class="ayah" id="ayah" dir="rtl" lang="ar"></p>
      <p class="tr" id="tr"></p>
      <p class="ref" id="ref"></p>
      <p class="cap" id="cap"></p>
      <div class="nm" id="n1"></div>
      <p class="cap" id="wi"></p>
      <div class="nm" id="n2"></div>
      <p class="cap" id="date"></p>
      <div class="sig"><div class="sg"><span class="sn" id="s1"></span><i>Bride</i></div><div class="sg"><span class="sn" id="s2"></span><i>Groom</i></div></div>
    </div>
  </div>
  <p class="tag" id="tag">In the name of Allah, the Most Gracious, the Most Merciful</p>
  <p class="hint" id="hint">Scroll</p>
</section></main>

<script>
/* Edit the card text here */
const D={
 bism:"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ",
 ayah:"وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً ۚ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِّقَوْمٍ يَتَفَكَّرُونَ",
 tr:"And among His signs is this, that He created for you mates from among yourselves, that you may dwell in tranquility with them, and He has put love and mercy between your hearts. Verily in that are signs for those who reflect.",
 ref:"Surah Ar-Rum · 30:21",
 cap:"With the blessings of Allah, we joyfully invite you to the Nikkah of",
 n1:"Tauheed Ahmed",n2:"Sahiba Parveen",
 date:"Date: The 18th of December 2026 (Friday), at VIP Lawn, in the city of Varanasi",
 s1:"Sahiba Parveen",s2:"Tauheed Ahmed"
};
const $=id=>document.getElementById(id),R=()=>Math.random()*2-1,cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const fx=[],L=[];
function reg(el,s,e,o){fx.push({el,s,e,t:-1,nx:R(),ny:R(),r:R()*360,k:.4+Math.random()*1.8,...o})}
function T(el,txt,chars,cls){
 txt.split(" ").forEach((w,i,a)=>{
  const wd=document.createElement("span");
  if(chars){wd.className="w";[...w].forEach(ch=>{const c=document.createElement("span");c.className="c";c.textContent=ch;wd.append(c);L.push(c)})}
  else{wd.className="w c "+(cls||"");wd.textContent=w;L.push(wd)}
  el.append(wd);if(i<a.length-1)el.append(" ");
 });
}
const bw=D.bism.split(" ").map(w=>{const s=document.createElement("span");s.className="w gold";s.textContent=w;return s});
$("bism").append(...bw);
T($("ayah"),D.ayah,0);T($("tr"),D.tr,1);T($("ref"),D.ref,1);T($("cap"),D.cap,1);
T($("n1"),D.n1,0);T($("wi"),"— with —",1);T($("n2"),D.n2,0);T($("date"),D.date,1);
$("s1").textContent=D.s1;$("s2").textContent=D.s2;
document.querySelectorAll(".sig i").forEach(e=>L.push(e));
L.forEach((el,i)=>{const s=.14+i/L.length*.22+Math.random()*.16;reg(el,s,s+.28)});

reg($("paper"),.4,.8,{nx:0,ny:0,r:0,k:.9,o:1.2});
reg($("band"),.5,.85,{nx:0,ny:0,r:0,k:1.18});
reg($("inner"),.56,.9,{nx:0,ny:0,r:0,k:1.12});

function ring(x0,y0,x1,y1,d,ph=0){
 const w=x1-x0,h=y1-y0,nx=Math.round(w/d),ny=Math.round(h/d),p=[];
 for(let i=0;i<nx;i++)p.push([x0+w*(i+ph)/nx,y0,"top"]);
 for(let i=0;i<ny;i++)p.push([x1,y0+h*(i+ph)/ny,"right"]);
 for(let i=0;i<nx;i++)p.push([x1-w*(i+ph)/nx,y1,"bottom"]);
 for(let i=0;i<ny;i++)p.push([x0,y1-h*(i+ph)/ny,"left"]);
 return p;
}
const SD={top:180,right:-90,bottom:0,left:90};
function orn(x,y,sz,sym,rot,col,s,e){
 const d=document.createElement("div");d.className="o";
 d.style.cssText=`left:${x}cqw;top:${y}cqw;width:${sz}cqw;height:${sz}cqw;margin:${-sz/2}cqw 0 0 ${-sz/2}cqw`;
 d.innerHTML=`<svg viewBox="0 0 100 100" style="color:${col};transform:rotate(${rot}deg)"><use href="#${sym}"/></svg>`;
 $("orn").append(d);reg(d,s,e);
}
const S=()=>.5+Math.random()*.3,DIR={top:[1,0,90],right:[0,1,180],bottom:[-1,0,270],left:[0,-1,0]};
function vine(x0,y0,x1,y1,amp,hw){
 let d="";
 [[x0,y0,x1,y0],[x1,y0,x1,y1],[x1,y1,x0,y1],[x0,y1,x0,y0]].forEach(([ax,ay,bx,by],j)=>{
  const len=Math.hypot(bx-ax,by-ay),k=Math.round(len/hw),n=Math.round(len*1.5),nx=-(by-ay)/len,ny=(bx-ax)/len;
  for(let i=j?1:0;i<=n;i++){const u=i/n,o=amp*Math.sin(Math.PI*k*u);d+=(d?"L":"M")+(ax+(bx-ax)*u+nx*o).toFixed(1)+" "+(ay+(by-ay)*u+ny*o).toFixed(1)}
 });
 return d+"Z";
}
$("orn").insertAdjacentHTML("afterbegin",`<svg class="vn" viewBox="0 0 100 188">${[[5.3,5.3,94.7,182.7,2,8],[5.3,5.3,94.7,182.7,-2,8],[17,17,83,171,.9,6]].map(a=>`<path pathLength="1" d="${vine(...a)}"/>`).join("")}</svg>`);
const vp=[...document.querySelectorAll(".vn path")];
const cn=(x,y)=>(x<6||x>94)&&(y<6||y>182);
ring(5.3,5.3,94.7,182.7,20).forEach(([x,y,sd])=>{const s=S();cn(x,y)?orn(x<50?6.8:93.2,y<94?6.8:181.2,13,"rose",0,"",s,s+.2):orn(x,y,10,"pal2",SD[sd],"",s,s+.2)});
ring(5.3,5.3,94.7,182.7,20,.5).forEach(([x,y,sd])=>{const[dx,dy,a]=DIR[sd],s=S();
 orn(x,y,5,"rf",Math.random()*60,"",s,s+.18);
 orn(x+dx*4,y+dy*4,5.6,"rl",a,"",s,s+.18);orn(x-dx*4,y-dy*4,5.6,"rl",a+180,"",s,s+.18)});
ring(17,17,83,171,4.4).forEach(([x,y,sd],i)=>{const s=.55+Math.random()*.3;
 if(i%2)orn(x,y,4.2,"lf",(sd=="top"||sd=="bottom"?0:90)+(i%4==1?35:-35),"",s,s+.15);
 else orn(x,y,3.3,"fl",Math.random()*72,i%6?"#ec6a94":"#d62f45",s,s+.15)});

let W=innerWidth,H=innerHeight,cur=0,tg=0,run=false;const hero={dx:0,dy:0,K:1};
const E=t=>1-Math.pow(1-t,3),G=[244,206,110],K=[52,38,26];
function render(p){
 for(const f of fx){
  const t=cl((p-f.s)/(f.e-f.s));if(f.t===t)continue;f.t=t;
  const q=1-E(t);
  f.el.style.transform=t>=1?"none":`translate(${f.nx*W*.6*q}px,${f.ny*H*.6*q}px) rotate(${f.r*q}deg) scale(${1+(f.k-1)*q})`;
  f.el.style.opacity=cl(t*(f.o||3));
 }
 vp.forEach((e,i)=>e.style.strokeDashoffset=1-cl((p-.5-i*.05)/.38));
 const pt=E(cl((p-.4)/.4));
 $("card").style.setProperty("--ink",`rgb(${G.map((g,i)=>Math.round(g+(K[i]-g)*pt)).join(",")})`);
 const tb=E(cl((p-.16)/.42)),q=1-tb,b=$("bism");
 b.style.transform=`translate(${hero.dx*q}px,${hero.dy*q}px) scale(${1+(hero.K-1)*q})`;
 b.style.filter=`drop-shadow(0 0 ${16*q}px rgba(255,200,90,${.75*q}))`;
 bw.forEach((w,i)=>{const m=Math.sin(Math.PI*tb)*(i%2?-1:1);w.style.transform=`translate(0,${m*28}px) rotate(${m*10}deg)`});
 ["s1","s2"].forEach((id,i)=>{const t=E(cl((p-.84-i*.04)/.12));$(id).style.clipPath=`inset(-25% ${100-110*t}% -25% -10%)`});
 $("tag").style.opacity=$("hint").style.opacity=1-cl(p/.08);
}
function measure(){
 W=innerWidth;H=innerHeight;
 const b=$("bism");b.style.transform="none";b.style.filter="none";
 const r=b.getBoundingClientRect();
 hero.K=Math.min(W*.88,820)/r.width;
 hero.dx=W/2-(r.left+r.width/2);
 hero.dy=H*.46-(r.top+r.height/2);
 $("tag").style.top=(H*.46+r.height*hero.K/2+26)+"px";
 fx.forEach(f=>f.t=-1);
}
function upd(){const m=document.documentElement.scrollHeight-innerHeight;tg=m>0?cl(scrollY/m):0}
function tick(){cur+=(tg-cur)*.12;if(Math.abs(tg-cur)<5e-4)cur=tg;render(cur);if(cur!==tg)requestAnimationFrame(tick);else run=false}
function kick(){upd();if(!run){run=true;requestAnimationFrame(tick)}}
measure();
if(matchMedia("(prefers-reduced-motion: reduce)").matches){cur=tg=1;render(1)}
else{upd();cur=tg;render(cur);addEventListener("scroll",kick,{passive:true})}
addEventListener("resize",()=>{measure();upd();render(cur)});
document.fonts&&document.fonts.ready.then(()=>{measure();render(cur)});
</script>
</body>
</html>
